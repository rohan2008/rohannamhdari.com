y safety check passes. Software is done and tested in simulation; the hardware build is in progress at the SCU Maker Lab.`,steps:[{title:`Detect`,body:`A YOLOv8 model or HSV colour thresholds find the balloon, ignoring laser dots and look-alikes far from where it should be.`},{title:`Predict`,body:`Two Kalman filters run side by side, one for steady motion and one for falls and bounces, weighted by whichever predicts better.`},{title:`Aim`,body:`The turret matches the balloon's speed (feedforward), corrects the leftover error, and aims ahead by the measured latency plus servo delay.`},{title:`Lock`,body:`The real detection has to stay inside a lock zone for 5 frames in a row. The zone scales with how big the balloon looks.`},{title:`Decide`,body:`One function, laser_should_fire(), is the only place in the code that can turn the laser on.`}],stats:[{from:21,to:100,unit:`%`,label:`time locked on a swinging balloon, after adding feedforward and lead`},{from:72,to:9,unit:` ms`,label:`age of the frame being processed, with a newest-frame-only camera thread`},{from:60,to:14,unit:` px`,approx:!0,label:`aiming error on a fast falling toss, once the acceleration model was added`},{to:124,label:`unit tests, including one for every laser safety rule`}],note:`All results measured in simulation and on a laptop webcam, since the hardware isn't built yet.`,stack:[`Python`,`Arduino C++`,`OpenCV`,`YOLOv8`,`Kalman filters (IMM)`,`pyserial`],image:`/assets/projects/balloon-turret.webp`,demo:{label:`Try the tracker`,href:`/balloon-turret/`},source:`https://github.com/rohan2008/balloon-turret`},{name:`Chess Vision`,status:`Live`,live:!0,tags:[`Vision`],tagline:`Point any camera at a chess board and hear the best move.`,summary:`Works with a phone, a laptop webcam, a USB camera or Meta glasses. A vision model reads the board from the photo, the position is checked and tracked move by move, and Stockfish picks the best move, which is spoken out loud and drawn on screen.`,steps:[{title:`Pick a camera`,body:`Back or front camera, any webcam, a photo, a shared window, or Meta glasses.`},{title:`Read the board`,body:`Gemini turns the photo into an exact 8×8 placement and works out which way the board faces.`},{title:`Track the game`,body:`chess.js checks the position is legal, spots the opponent's move, and keeps castling and en passant rights correct.`},{title:`Get the move`,body:`Stockfish 19 picks the best move. It's spoken, e.g. "Knight g1 to f3, check", and drawn as an arrow.`}],stats:[{to:3,label:`top engine lines shown with every move`},{to:5,label:`kinds of camera input, from webcams to Meta glasses`},{to:1,unit:` s`,approx:!0,label:`of stillness before auto-scan fires, so it never reads a hand mid-move`}],stack:[`JavaScript`,`Node.js`,`Gemini vision`,`Stockfish 19`,`chess.js`],image:`/assets/projects/chessvision.webp`,demo:{label:`Open Chess Vision`,href:`/chessvision/`},source:`https://github.com/rohan2008/chessvision`},{name:`Open Play Rotation Maker`,status:`Live`,live:!0,tags:[`Web`],tagline:`Balanced courts, even sit-outs and fresh partners for club open play.`,summary:`Check players in, enter their ratings, and press Next round: it builds balanced teams for each court, keeps sit-outs even, and keeps partners changing. It also runs round robins and single-elimination brackets, for pickleball and tennis, doubles or singles. No sign-up, no server, no tracking.`,steps:[{title:`Add players`,body:`Type names with an optional DUPR rating, or paste a whole list at once.`},{title:`Check in`,body:`Tick whoever is here. Late arrivals are credited so they don't get a pile of catch-up games.`},{title:`Pick a format`,body:`Open play, round robin, bracket, or pool play into a bracket, on 1 to 30 courts.`},{title:`Next round`,body:`It scores random lineups for uneven teams, repeat partners and repeat opponents, and keeps the fairest one.`}],stats:[{to:900,approx:!0,label:`lineups tried every round, keeping the fairest`},{to:30,label:`courts at most, doub
