<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"><title>Runway | Card Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400..700&family=Chivo+Mono:wght@400..500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
      try {
        const saved = localStorage.getItem('runway-theme');
        if (saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
      } catch {}
    </script>
<script>
// Offline demo: answer the dashboard's API calls from saved snapshots of the seeded demo company.
(function () {
  var BASE = 'https://runway-demo.offline', DATA = '/runway/data/';
  var REPLY = 'This public demo runs on saved demo data, so approvals and replies are switched off. The demo video shows the full flow.';
  var realFetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : input.url;
    if (url.indexOf(BASE) !== 0) return realFetch(input, init);
    var path = url.slice(BASE.length);
    var method = ((init && init.method) || 'GET').toUpperCase();
    if (method !== 'GET') {
      var status = path.indexOf('/transactions') === 0 ? 503 : 200;
      return Promise.resolve(new Response(JSON.stringify({ reply: REPLY, answer: REPLY }), { status: status, headers: { 'Content-Type': 'application/json' } }));
    }
    return realFetch(DATA + path.replace(/^\//, '').replace(/[\/?&=]/g, '_') + '.json');
  };
})();
</script>
</head>
<body>
    <div class="terminal-card">
        <div class="header">
            <div class="brand">
                <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="currentColor"/><path d="M8 22 L16 9 L24 22" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>Runway</span>
            </div>
            <h1>Card terminal</h1>
            <p class="lede">Swipe a test charge. Runway analyzes it and texts the founder if it needs a decision.</p>
        </div>
        
        <div class="content">
            <div class="input-group">
                <label for="merchant">Merchant</label>
                <input type="text" id="merchant" placeholder="e.g. Anthropic, Cursor, Blue Bottle" value="Cursor">
            </div>

            <div class="row">
            <div class="input-group">
                <label for="amount">Amount</label>
                <div class="amount-input-container">
                    <span class="currency-symbol">$</span>
                    <input type="number" id="amount" placeholder="0.00" step="0.01" value="1400.00">
                </div>
            </div>

            <div class="input-group">
                <label for="pillar">Category</label>
                <select id="pillar">
                    <option value="auto">Auto</option>
                    <option value="ai_spend">AI spend</option>
                    <option value="saas_sprawl">SaaS</option>
                    <option value="compliance">Expense</option>
                </select>
            </div>
            </div>

            <div class="input-group">
                <label for="employee_id">Employee</label>
                <select id="employee_id">
                    <option value="">Company card (no employee)</option>
                    <option value="00000001-0000-4000-8000-000000000010">Sarah J. (Head of Design)</option>
                    <option value="00000001-0000-4000-8000-000000000011">Marcus K. (Senior Engineer)</option>
                    <option value="00000001-0000-4000-8000-000000000012">Alex L. (Product Manager)</option>
                    <option value="00000001-0000-4000-8000-000000000013">Tom R. (Sales Lead)</option>
                    <option value="00000001-0000-4000-8000-000000000014">Priya S. (Engineer)</option>
                    <option value="00000001-0000-4000-8000-000000000015">Jordan M. (Engineer)</option>
                    <option value="00000001-0000-4000-8000-000000000016">Casey W. (Designer)</option>
                    <option value="00000001-0000-4000-8000-000000000017">Riley B. (Marketing)</option>
                </select>
            </div>

            <div class="input-group">
                <label for="memo">Memo <span class="opt">optional</span></label>
                <input type="text" id="memo" placeholder="Lunch with client, API credits, etc.">
            </div>

            <button id="swipe-button" class="swipe-btn">
                <span>Swipe card</span>
            </button>

            <div id="status-tray" class="status-tray">
                <p id="status-message"></p>
            </div>

            <div class="recent-swipes">
                <div class="recent-head">
                    <h2>Recent swipes</h2>
                    <button type="button" id="clear-swipes" class="clear-btn" hidden>Clear</button>
                </div>
                <div id="swipes-list">
                    </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
